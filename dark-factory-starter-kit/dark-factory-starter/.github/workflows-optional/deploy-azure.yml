# Optional: deploy to Azure Container Apps instead of Cloudflare. To use it, move this file into
# .github/workflows/ and delete deploy.yml. See README "Other deployment targets".
# Signs in with an OIDC federated credential, so no Azure secrets are stored.
# The image goes to GitHub Container Registry (free for public packages). Off until DEPLOY_ENABLED=true.
name: deploy-azure
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write          # push the image to ghcr.io
  id-token: write          # lets the job sign in to Azure with OIDC

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      APP: ${{ vars.CONTAINER_APP }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_URL: ${{ vars.APP_URL }}               # the app's main ingress URL
      PROBE_KEY: ${{ secrets.PROBE_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: make install && make test

      - name: Build and push the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create a new revision with no traffic
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          STABLE=$(az containerapp ingress traffic show -n "$APP" -g "$RG" --query "[?weight==\`100\`].revisionName | [0]" -o tsv)
          [ -n "$STABLE" ] || STABLE=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestReadyRevisionName -o tsv)
          echo "STABLE=$STABLE" >> "$GITHUB_ENV"
          SUFFIX="v${SHA:0:7}"
          # Traffic is pinned to named revisions, so a new revision starts at 0%.
          az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" --revision-suffix "$SUFFIX" \
            --set-env-vars "GIT_SHA=$SHA" --only-show-errors > /dev/null
          NEW="$APP--$SUFFIX"
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          FQDN=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$NEW" --query properties.fqdn -o tsv)
          echo "CANDIDATE_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Probe the new revision before it takes traffic
        run: bash .github/factory/smoke.sh "$CANDIDATE_URL" "$SHA"

      - name: Canary at 10%
        run: az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$STABLE=90" "$NEW=10" --only-show-errors > /dev/null

      - name: Watch the canary for 3 minutes
        run: |
          for _ in 1 2 3; do
            bash .github/factory/smoke.sh "$APP_URL" || exit 1          # either revision may answer
            bash .github/factory/smoke.sh "$CANDIDATE_URL" "$SHA" || exit 1
            sleep 60
          done

      - name: Promote to 100%
        run: az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$NEW=100" --only-show-errors > /dev/null

      - name: Probe production
        run: bash .github/factory/smoke.sh "$APP_URL" "$SHA"

      - name: Roll back and alert
        if: failure() && env.STABLE != ''
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$STABLE=100" --only-show-errors > /dev/null
          [ -n "${NEW:-}" ] && az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$NEW" --only-show-errors || true
          gh issue create --title "Deploy rolled back: ${SHA:0:7}" --label factory-alert,escaped-bug \
            --assignee "${{ vars.ALERT_ASSIGNEE || github.repository_owner }}" \
            --body "Probes failed for $SHA, so the app went back to revision $STABLE. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
