# Deploy to Cloudflare Workers in stages: upload with no traffic, probe the preview URL,
# 10% canary probed for 3 minutes, promote to 100%, probe production. Any failure rolls back.
# Off until you set the repository variable DEPLOY_ENABLED=true.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
      WORKER: ${{ vars.WORKER_NAME }}
      PROBE_KEY: ${{ secrets.PROBE_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test
        run: make install && make test

      - name: Remember the stable version
        run: |
          stable=$(npx wrangler deployments status --json | jq -r '.versions | max_by(.percentage) | .version_id')
          echo "STABLE=$stable" >> "$GITHUB_ENV"

      - name: Upload the new version (no traffic yet)
        run: |
          npx wrangler versions upload --tag "${SHA:0:12}" --message "deploy $SHA" --var "GIT_SHA:$SHA" | tee /tmp/upload.txt
          echo "NEW=$(grep -oP 'Worker Version ID: \K[0-9a-f-]+' /tmp/upload.txt)" >> "$GITHUB_ENV"
          echo "PREVIEW=$(grep -oP 'Version Preview URL: \K\S+' /tmp/upload.txt)" >> "$GITHUB_ENV"

      - name: Probe the new version before it takes traffic
        if: env.PREVIEW != ''
        run: bash .github/factory/smoke.sh "$PREVIEW" "$SHA"

      - name: Canary at 10%
        run: npx wrangler versions deploy "$NEW@10" "$STABLE@90" --message "canary $SHA" --yes

      - name: Watch the canary for 3 minutes
        run: |
          for _ in 1 2 3; do
            bash .github/factory/smoke.sh "$APP_URL" "$SHA" "Cloudflare-Workers-Version-Overrides: $WORKER=\"$NEW\"" || exit 1
            sleep 60
          done

      - name: Promote to 100%
        run: npx wrangler versions deploy "$NEW@100" --message "promote $SHA" --yes

      - name: Probe production
        run: bash .github/factory/smoke.sh "$APP_URL" "$SHA"

      - name: Roll back and alert
        if: failure() && env.NEW != '' && env.STABLE != ''
        run: |
          npx wrangler versions deploy "$STABLE@100" --message "auto-rollback from $SHA" --yes
          gh issue create --title "Deploy rolled back: ${SHA:0:7}" --label factory-alert,escaped-bug \
            --assignee "${{ vars.ALERT_ASSIGNEE || github.repository_owner }}" \
            --body "Probes failed for $SHA, so production went back to version $STABLE. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
