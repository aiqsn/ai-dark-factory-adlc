# Build: turns an issue labelled factory:build into a pull request.
# Tries each model in FACTORY_MODELS in turn until `make test` passes.
name: factory-build
on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: factory-build          # one build at a time
  cancel-in-progress: false

jobs:
  build:
    if: github.event.label.name == 'factory:build' && vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      MODELS: ${{ vars.FACTORY_MODELS }}
      ISSUE: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
      BODY: ${{ github.event.issue.body }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          make install
          pip install aider-chat

      - name: Check free-model quota
        if: contains(vars.FACTORY_MODELS, 'openrouter/')
        run: |
          left=$(curl -s https://openrouter.ai/api/v1/key \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            | jq '.data.free_model_daily_requests.remaining // 999')
          echo "Free OpenRouter requests left today: $left"
          if [ "$left" -lt 15 ]; then
            gh issue comment "$ISSUE" --body "Paused: only $left free OpenRouter requests left. Re-apply the label after 00:00 UTC."
            exit 1
          fi

      - name: Build the prompt
        run: |
          {
            echo "Implement the spec below. Follow AGENTS.md."
            echo "Add or update tests for every acceptance criterion."
            echo "Do not modify .github/, probes/, scenarios/ or AGENTS.md."
            echo
            echo "# $TITLE"
            echo
            echo "$BODY"
          } > /tmp/spec.md

      - name: Agent loop across providers
        run: |
          git checkout -b "factory/issue-$ISSUE"
          attempt=0
          for model in $MODELS; do
            attempt=$((attempt + 1))
            echo "::group::attempt $attempt: $model"
            timeout 15m aider --model "$model" \
              --yes-always --no-auto-commits --no-gitignore \
              --no-show-model-warnings --map-tokens 1024 \
              --read AGENTS.md \
              --test-cmd "make test" --auto-test \
              --message-file /tmp/spec.md || echo "$model failed or was rate-limited"
            echo "::endgroup::"
            if make test; then
              echo "ATTEMPTS=$attempt" >> "$GITHUB_ENV"
              echo "MODEL_USED=$model" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Every provider in the chain failed"; exit 1

      - name: Open the PR
        run: |
          git config user.name  "factory-bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add -A
          git reset -q -- '.aider*' || true
          git commit -m "factory: #$ISSUE $TITLE"
          git push -u origin "factory/issue-$ISSUE"
          gh pr create --base "$DEFAULT_BRANCH" --title "factory: $TITLE" --label factory \
            --body "Closes #$ISSUE. Built by the factory; the agent transcript is in the run log.<!-- factory-run {\"attempts\": $ATTEMPTS, \"model\": \"$MODEL_USED\"} -->"
          gh issue edit "$ISSUE" --remove-label factory:build

      - name: Escalate on failure
        if: failure()
        run: |
          gh issue comment "$ISSUE" --body "Factory run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE" --add-label needs-human --remove-label factory:build
