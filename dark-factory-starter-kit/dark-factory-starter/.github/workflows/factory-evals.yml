# Evals: score the reviewer against seeded defects. Runs on every PR that changes the factory's
# prompts, rubrics or AGENTS.md (people only: the path guard blocks the agent), and weekly.
# Make it a required check so a change that makes the reviewer worse can't merge.
name: factory-evals
on:
  pull_request:
    paths: ['.github/factory/**', 'AGENTS.md']
  schedule:
    - cron: '41 3 * * 1'       # weekly, Monday 03:41 UTC
  workflow_dispatch:
    inputs:
      review_model:
        description: Candidate reviewer model to evaluate
        required: false

permissions:
  contents: read
  models: read

jobs:
  reviewer-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL: ${{ inputs.review_model || vars.REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-scenarios
          token: ${{ secrets.SCENARIOS_TOKEN }}
          path: .holdout

      - name: Score the reviewer against seeded defects
        run: |
          bash .holdout/evals/reviewer/run.sh openrouter "$MODEL" .github/factory/review-rubric.md > /tmp/score.json
          { echo '### Reviewer eval'; echo '```json'; cat /tmp/score.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          jq -e --slurpfile b .holdout/evals/baseline.json \
            '.catch_rate >= $b[0].catch_rate - 0.05 and .false_reject_rate <= $b[0].false_reject_rate + 0.10' \
            /tmp/score.json > /dev/null || { echo "::error::Reviewer eval fell below the baseline"; exit 1; }
