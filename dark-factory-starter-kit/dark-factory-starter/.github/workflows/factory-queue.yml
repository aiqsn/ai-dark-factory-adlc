# Queue drain: every hour, if no build is running, promote the oldest factory:queued issue
# to factory:build. Queue many specs at once without GitHub cancelling pending runs.
name: factory-queue
on:
  schedule:
    - cron: '23 * * * *'       # hourly, at :23
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drain:
    if: vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}   # a PAT, so the label event starts the build workflow
    steps:
      - name: Promote the oldest queued spec
        run: |
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow factory-build.yml --json status \
            -q '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length')
          if [ "$busy" -gt 0 ]; then echo "A build is already running."; exit 0; fi
          next=$(gh issue list --repo "$GITHUB_REPOSITORY" --label factory:queued --state open \
            --json number,createdAt -q 'sort_by(.createdAt) | .[0].number // empty')
          if [ -z "$next" ]; then echo "Queue is empty."; exit 0; fi
          gh issue edit "$next" --repo "$GITHUB_REPOSITORY" --remove-label factory:queued --add-label factory:build
          echo "Started #$next"
