# Verify: every factory PR must pass the path guard, unit tests, reward-hacking probes,
# mutation testing, the hidden holdouts and two adversarial reviewers before it can auto-merge.
name: factory-verify
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  models: read

jobs:
  verify:
    if: startsWith(github.head_ref, 'factory/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.base_ref }}
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
      PROSECUTOR_MODEL: ${{ vars.PROSECUTOR_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: make install

      - name: Guard protected paths
        run: |
          if git diff --name-only "origin/$BASE...HEAD" \
               | grep -E '^(\.github/|probes/|scenarios/|AGENTS\.md$)'; then
            echo "::error::Agent touched protected paths"; exit 1
          fi

      - name: Unit tests
        run: make test

      - name: Reward-hacking probes
        run: bash .github/factory/probes.sh "origin/$BASE"

      - name: Mutation testing on changed code
        run: timeout 15m make mutation BASE="origin/$BASE"

      - name: Fetch hidden holdout scenarios
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-scenarios
          token: ${{ secrets.SCENARIOS_TOKEN }}
          path: .holdout

      - name: Holdout scenarios
        run: bash .holdout/run.sh

      - name: Adversarial reviews (two families, blind, in parallel)
        run: |
          git diff "origin/$BASE...HEAD" > /tmp/full.patch
          if [ "$(wc -c < /tmp/full.patch)" -gt 20000 ]; then
            echo '{"approve": false, "risk": "high", "summary": "Diff too large for free-tier review; a person should review it."}' > /tmp/verdict.json
            exit 0
          fi
          cp /tmp/full.patch /tmp/diff.patch
          SPEC="$(gh issue view "${GITHUB_HEAD_REF#factory/issue-}" --json body -q .body)"; export SPEC
          bash .github/factory/review.sh github     "$PROSECUTOR_MODEL" .github/factory/prosecutor.md    > /tmp/v1.json &
          bash .github/factory/review.sh openrouter "$REVIEW_MODEL"     .github/factory/review-rubric.md > /tmp/v2.json &
          wait
          jq -s '{
            approve: all(.[]; .approve == true),
            risk: (if any(.[]; .risk != "low") then "high" else "low" end),
            summary: (map(.summary // "no verdict") | join(" | "))
          }' /tmp/v1.json /tmp/v2.json > /tmp/verdict.json || echo '{}' > /tmp/verdict.json
          cat /tmp/verdict.json

      - name: Merge or escalate
        run: |
          approve=$(jq -r '.approve // false' /tmp/verdict.json 2>/dev/null || echo false)
          risk=$(jq -r '.risk // "high"' /tmp/verdict.json 2>/dev/null || echo high)
          summary=$(jq -r '.summary // "No valid verdict."' /tmp/verdict.json 2>/dev/null || echo "No valid verdict.")
          gh pr comment "$PR" --body "Factory review: approve=$approve, risk=$risk. $summary"
          if [ "$approve" = "true" ] && [ "$risk" = "low" ] && [ "${{ vars.AUTO_MERGE }}" = "true" ]; then
            gh pr merge "$PR" --squash --auto --delete-branch
          else
            gh pr edit "$PR" --add-label needs-human
          fi

      - name: Escalate a failed check
        if: failure()
        run: |
          gh pr edit "$PR" --add-label needs-human
          gh pr comment "$PR" --body "Factory checks failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record the review
        if: always()
        run: |
          rec=$(jq -c -s '{prosecutor: (.[0] // {}), second: (.[1] // {})}' /tmp/v1.json /tmp/v2.json 2>/dev/null || echo '{}')
          gh pr comment "$PR" --body "Review record <!-- factory-review $rec -->" || true
          { echo "### Review record"; echo '```json'; echo "$rec" | jq . 2>/dev/null || echo "$rec"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
