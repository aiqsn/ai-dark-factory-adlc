# Nightly health check: holdouts and smoke probes against production, 7-day metrics,
# and one "Factory alert" issue while anything is out of bounds.
name: factory-health
on:
  schedule:
    - cron: '17 6 * * *'       # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      FACTORY_ADMIN_PAT: ${{ secrets.FACTORY_ADMIN_PAT }}
      PROBE_KEY: ${{ secrets.PROBE_API_KEY }}
      ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || github.repository_owner }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-scenarios
          token: ${{ secrets.SCENARIOS_TOKEN }}
          path: .holdout

      - name: Nightly holdouts against main
        id: holdouts
        continue-on-error: true
        run: |
          [ -n "$APP_URL" ] || make install      # no deployed app yet: run.sh starts one from main
          bash .holdout/run.sh

      - name: Smoke probes against production
        id: smoke
        if: vars.APP_URL != ''
        continue-on-error: true
        run: bash .github/factory/smoke.sh "$APP_URL"

      - name: Metrics and alerts
        env:
          HOLDOUTS: ${{ steps.holdouts.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: bash .github/factory/health.sh
