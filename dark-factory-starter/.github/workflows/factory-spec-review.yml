# Spec red-team: comments a critique on every new spec before anything is built.
name: factory-spec-review
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  redteam:
    if: contains(github.event.issue.labels.*.name, 'spec') && vars.SPEC_REVIEW_MODEL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ secrets.FACTORY_PAT }}
      ISSUE: ${{ github.event.issue.number }}
      BODY: ${{ github.event.issue.body }}
      MODEL: ${{ vars.SPEC_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Attack the spec
        run: |
          jq -n --arg model "$MODEL" --arg spec "$BODY" \
                --rawfile rubric .github/factory/spec-redteam.md \
                '{model: $model, messages: [{role: "system", content: $rubric}, {role: "user", content: $spec}]}' > /tmp/req.json
          curl -s https://generativelanguage.googleapis.com/v1beta/openai/chat/completions \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/req.json \
            | jq -r '.choices[0].message.content // "Spec review unavailable; review it by hand."' > /tmp/critique.md
          gh issue comment "$ISSUE" --body-file /tmp/critique.md
